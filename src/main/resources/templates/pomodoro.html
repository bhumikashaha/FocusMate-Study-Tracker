<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro - FocusMate</title>
    <link rel="stylesheet" href="/css/static.css">

    <style>
        .time-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .time-select button {
            padding: 8px 14px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>🍅 Pomodoro Timer</h2>

        <!-- ⏱ Timer -->
        <div id="timer">25:00</div>

        <!-- ⏰ Time Selector -->
        <div class="time-select">
            <button onclick="setMinutes(25)">25 min</button>
            <button onclick="setMinutes(45)">45 min</button>
            <button onclick="setMinutes(60)">60 min</button>
        </div>

        <!-- ▶ Controls -->
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>

        <p class="pomodoro-hint">
            Focus deeply, distractions off 📵
        </p>

        <div class="links">
            <a th:href="@{/dashboard}">⬅ Back to Dashboard</a>
        </div>
    </div>
</div>

<script src="/js/pomodoro.js"></script>
</body>
</html>
